<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game with Floating Numbers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        #score {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #facc15;
        }
        #stats {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        .click-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 2rem;
        }
        .click-btn:active {
            transform: scale(0.95);
            background-color: #0ea5e9;
        }
        .shop {
            background: rgba(30, 41, 59, 0.7);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 320px;
        }
        .shop h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .upgrade-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #38bdf8;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .upgrade-btn:hover:not(:disabled) {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .upgrade-btn:disabled {
            border-color: #64748b;
            color: #64748b;
            cursor: not-allowed;
        }
        .floating-number {
            position: absolute;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.3rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }
    </style>
</head>

    <button class="click-btn" onclick="clicked(event)">Click Me!</button>
